appId: com.jackaistudio.jackdsh
productName: JackDSH
npmRebuild: false
directories:
  # 默认输出到仓库内 release/（CI 直接用）。
  # 本机 macOS 构建时 package.json 脚本会用 -c.directories.output 覆盖到
  # $DSH_BUILD_OUT（默认 ~/.jds-build-out）：输出必须落在 iCloud（桌面与文稿
  # 同步）管理范围之外，否则 FileProvider 会给产物打上
  # com.apple.fileprovider.fpfs#P 等扩展属性，codesign 报 "detritus not allowed"。
  output: release
  buildResources: build

files:
  - "src/**/*"
  - "config-templates/**/*"
  - "package.json"

extraResources:
  - from: "bundle-runtime/"
    to: "runtime"
    filter:
      - "**/*"
  - from: "node_modules/"
    to: "node_modules"
    filter:
      - "!**/* 2*"
      - "!**/.bin/**"
      - "!**/*.md"
      - "!**/*.ts"
      - "!**/*.map"
      - "!.pnpm/**"
      - "!.pnpm*/**"
      - "!.pnpm-workspace-state-v1.json"
      # node-pty 构建残留的绝对符号链接（指向 homebrew python），
      # codesign --verify --strict 会判 "invalid destination for symbolic link"
      - "!**/node-pty/build/node_gyp_bins/**"
      # 纯构建期工具，运行期不需要；剔除可大幅缩小体积与签名耗时
      - "!electron/**"
      - "!electron-builder/**"
      - "!app-builder-lib/**"
      - "!app-builder-bin/**"
      - "!builder-util/**"
      - "!dmg-builder/**"
      - "!electron-publish/**"
      - "!7zip-bin/**"
      - "!typescript/**"
      # 排除非 macOS 平台的预编译底层 C++ 库（防止全平台二进制撑爆包体）
      - "!@img/sharp-libvips-linux*/**"
      - "!@img/sharp-libvips-win32*/**"
      - "!@img/sharp-libvips-darwin-x64/**"
      - "!@img/sharp-linux*/**"
      - "!@img/sharp-win32*/**"
      - "!@img/sharp-darwin-x64/**"
      - "!@img/sharp-wasm32/**"
      - "!@img/sharp-freebsd*/**"
      - "!@vscode/ripgrep-linux*/**"
      - "!@vscode/ripgrep-win32*/**"
      - "!@vscode/ripgrep-darwin-x64/**"

mac:
  category: public.app-category.developer-tools
  # 极简双版本：macOS 仅提供 Apple Silicon (M1/M2/M3/M4) arm64 dmg 镜像
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: "${productName}-${version}-Mac-arm64.${ext}"
  # 公证（notarization）要求开启 hardened runtime；无公证凭据时仅影响签名配置，不影响构建
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  # Windows 仅提供 NSIS 标准安装包（单一交付物）。
  # 历史沿革：早期曾同时提供「绿色免安装便携版 zip」，现已移除——双产物意味着
  # 两条安装路径要各自验证（解压路径 vs 注册表卸载路径），而便携模式的能力
  # （数据落在程序目录、U 盘即用）由运行期 --portable / DSH_PORTABLE 提供，
  # 与「产物形态」无关，装完照样可以用便携模式，故不需要额外的 zip 产物。
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-Windows-Setup.${ext}"

nsis:
  # 助手式安装器：标准安装向导 + 可自选安装目录（对应 README 的对外承诺）。
  #
  # ⚠️ 曾一度误判为「加这段就会让静默安装必崩」，实际不是。当时的现场是
  # STATUS_ACCESS_VIOLATION(0xC0000005)，$INSTDIR 被建出来但一个文件都没装进去，
  # 连续 4 次全崩，于是把配置回退了。后来用 store 压缩做快速 A/B 才发现：
  # 同样的配置重建后连续 9 次成功、1 次失败——失败全部聚集在「刚做完密集构建、
  # 杀软正在实时扫描新写盘的 178MB 安装器」的时间窗内。
  # 崩溃指纹：%TEMP%\nsXXXX.tmp 里只剩 System.dll + UAC.dll（助手式在 .onInit 里
  # 会调 UAC 插件的 UAC_IsInnerInstance），连 StdUtils 都没走到；而 oneClick
  # 的对应目录是 StdUtils/System/WinShell/nsExec（不含 UAC.dll），所以它不受影响。
  # 结论：产物本身没问题，是构建后立即运行撞上扫描窗口。改配置解决不了，
  # 别为此回退这一段（回退会丢掉 README 承诺的「可自选安装目录」）。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JackDSH
  # 卸载时不删用户数据目录（工作区、会话、模型授权都在 userData 下的 dsh-data），
  # 避免用户卸载重装时误丢工作区。
  deleteAppDataOnUninstall: false
