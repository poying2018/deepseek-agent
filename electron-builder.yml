appId: com.jackaistudio.jackdsh
# ⚠️ appId 故意保持 com.jackaistudio.jackdsh **不随品牌改名**。
# NSIS 的卸载注册表键 GUID 由 appId 派生：改了 appId 就会生成一个新 GUID，
# 老版本在「应用和功能」里的卸载条目会变成删不掉的孤儿，且新旧版本无法原地覆盖升级。
# appId 只出现在系统日志/清单里，用户基本看不到，没必要为此牺牲升级连续性。
# 若确实要改，必须同时提供「卸载旧版 → 安装新版」的迁移指引。
productName: DeepSeek Agent
npmRebuild: false
directories:
  # 默认输出到仓库内 release/（CI 直接用）。
  # 本机 macOS 构建时 package.json 脚本会用 -c.directories.output 覆盖到
  # $DSH_BUILD_OUT（默认 ~/.jds-build-out）：输出必须落在 iCloud（桌面与文稿
  # 同步）管理范围之外，否则 FileProvider 会给产物打上
  # com.apple.fileprovider.fpfs#P 等扩展属性，codesign 报 "detritus not allowed"。
  output: release
  buildResources: build

files:
  - "src/**/*"
  - "config-templates/**/*"
  - "package.json"

extraResources:
  - from: "bundle-runtime/"
    to: "runtime"
    filter:
      - "**/*"
  - from: "node_modules/"
    to: "node_modules"
    filter:
      - "!**/* 2*"
      - "!**/.bin/**"
      - "!**/*.md"
      - "!**/*.ts"
      - "!**/*.map"
      - "!.pnpm/**"
      - "!.pnpm*/**"
      - "!.pnpm-workspace-state-v1.json"
      # node-pty 构建残留的绝对符号链接（指向 homebrew python），
      # codesign --verify --strict 会判 "invalid destination for symbolic link"
      - "!**/node-pty/build/node_gyp_bins/**"
      # 纯构建期工具，运行期不需要；剔除可大幅缩小体积与签名耗时
      - "!electron/**"
      - "!electron-builder/**"
      - "!app-builder-lib/**"
      - "!app-builder-bin/**"
      - "!builder-util/**"
      - "!dmg-builder/**"
      - "!electron-publish/**"
      - "!7zip-bin/**"
      - "!typescript/**"
      # ⚠️ 这里**不要**按平台排除 sharp / libvips 的预编译库。
      #
      # 历史上曾用 `!@img/sharp-win32*/**`、`!@img/sharp-linux*/**` 之类
      # 「只留 macOS 的二进制」来省体积，但那是个误判：
      # **pnpm 本来就只装当前平台的可选依赖**（本机实测 @img/ 下只有
      # sharp-win32-x64 一个，19MB），根本不存在「全平台二进制撑爆包体」。
      # 那些规则唯一实际效果是把**当前平台**的 sharp 排除掉 —— 而 0.1.5+
      # 内核的 @deepseek-ai/dsh-attachment-local 需要它，结果是 Windows 包
      # 一更新内核就崩：
      #   Could not load the "sharp" module using the win32-x64 runtime
      # 同样地，@vscode/ripgrep 的实际二进制在嵌套路径
      # （@vscode/ripgrep/node_modules/@vscode/ripgrep-<平台>）下，
      # 顶层的 `!@vscode/ripgrep-win32*/**` 也从来匹配不到、纯属噪音。
      # 结论：交给 pnpm 的平台解析，构建侧不再插手。

mac:
  category: public.app-category.developer-tools
  # 极简双版本：macOS 仅提供 Apple Silicon (M1/M2/M3/M4) arm64 dmg 镜像
  target:
    - target: dmg
      arch:
        - arm64
  # 同 win 段：产物名用连字符字面量，避免与 latest.yml 里的 url 不一致
  artifactName: "DeepSeek-Agent-${version}-Mac-arm64.${ext}"
  # 公证（notarization）要求开启 hardened runtime；无公证凭据时仅影响签名配置，不影响构建
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  # Windows 仅提供 NSIS 标准安装包（单一交付物）。
  # 历史沿革：早期曾同时提供「绿色免安装便携版 zip」，现已移除——双产物意味着
  # 两条安装路径要各自验证（解压路径 vs 注册表卸载路径），而便携模式的能力
  # （数据落在程序目录、U 盘即用）由运行期 --portable / DSH_PORTABLE 提供，
  # 与「产物形态」无关，装完照样可以用便携模式，故不需要额外的 zip 产物。
  target:
    - target: nsis
      arch:
        - x64
  # ⚠️ 产物名**故意不写 ${productName}**：productName 是 "DeepSeek Agent"（含空格），
  # 而 electron-builder 在 latest.yml 的 url/path 里会把空格折成连字符，磁盘上的文件
  # 却仍带空格 —— 两者不一致，electron-updater 按 latest.yml 去找会 404。
  # 实测：latest.yml 写 DeepSeek-Agent-9.14.24-Windows-Setup.exe，
  #       磁盘上却是 "DeepSeek Agent-9.14.24-Windows-Setup.exe"。
  # 所以产物名用连字符字面量，显示名才用 productName。
  artifactName: "DeepSeek-Agent-${version}-Windows-Setup.${ext}"

nsis:
  # 助手式安装器：标准安装向导 + 可自选安装目录（对应 README 的对外承诺）。
  #
  # ⚠️ 曾一度误判为「加这段就会让静默安装必崩」，实际不是。当时的现场是
  # STATUS_ACCESS_VIOLATION(0xC0000005)，$INSTDIR 被建出来但一个文件都没装进去，
  # 连续 4 次全崩，于是把配置回退了。后来用 store 压缩做快速 A/B 才发现：
  # 同样的配置重建后连续 9 次成功、1 次失败——失败全部聚集在「刚做完密集构建、
  # 杀软正在实时扫描新写盘的 178MB 安装器」的时间窗内。
  # 崩溃指纹：%TEMP%\nsXXXX.tmp 里只剩 System.dll + UAC.dll（助手式在 .onInit 里
  # 会调 UAC 插件的 UAC_IsInnerInstance），连 StdUtils 都没走到；而 oneClick
  # 的对应目录是 StdUtils/System/WinShell/nsExec（不含 UAC.dll），所以它不受影响。
  # 结论：产物本身没问题，是构建后立即运行撞上扫描窗口。改配置解决不了，
  # 别为此回退这一段（回退会丢掉 README 承诺的「可自选安装目录」）。
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Agent
  # 卸载时不删用户数据目录（工作区、会话、模型授权都在 userData 下的 dsh-data），
  # 避免用户卸载重装时误丢工作区。
  #
  # ⚠️ 数据目录路径由 package.json 的 `name`（= jackdsh）决定，**不随 productName 改名**，
  # 否则 %APPDATA%\jackdsh\dsh-data 里的工作区/会话/模型授权会全部「消失」。
  # 详见 README「品牌名与内部标识」一节。
  deleteAppDataOnUninstall: false
