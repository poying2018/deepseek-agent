# 依赖安装布局 —— 必须与 .npmrc 保持一致，且**必须生效**。
#
# 背景：本项目打出的安装包通过 electron-builder 的 extraResources 把 node_modules
# 复制进应用，而该 filter **排除了 .pnpm/**。所以根 node_modules 必须是 pnpm 的
# **hoisted（扁平）布局**；若落成默认的 isolated（软链进 .pnpm）布局，打进包里的
# node_modules 会只剩一堆指向 .pnpm 的死链，而构建过程**不会报任何错**。
#
# .npmrc 里同样写了这两项，但 pnpm 11+ 已把设置项迁到本文件（package.json 的
# pnpm 字段亦然），实测 pnpm 12.4.1 **不再读取 .npmrc 的这两个键**
# （`pnpm config get node-linker` 返回 undefined）——本地用 pnpm 11+ 会静默装成
# 隔离布局。这里显式声明，保证任何 pnpm 版本都能得到与 CI 一致的扁平布局。
nodeLinker: hoisted
shamefullyHoist: true

# pnpm 11+ 的构建脚本白名单。
#
# pnpm 10 起默认不执行依赖的 postinstall/install 脚本（供应链安全）。
# 本项目的依赖树里有若干**必须**执行安装脚本来落位预编译二进制的包，
# 不放行会导致安装以 ERR_PNPM_IGNORED_BUILDS 结束、且原生模块缺少二进制。
#
# 这些包都在 pnpm-lock.yaml 锁定的依赖树内（CI 的 pnpm install 等价于全部放行），
# 逐一登记只是为了让本地用 pnpm 11+ 的开发者得到与 CI 一致的安装结果。
allowBuilds:
  # koffi —— DSH 原生目录选择器（dsh-host-directory-picker-native）驱动 COM
  # IFileOpenDialog 用的 FFI 库。本发行版在 Windows 上固定挂 browse（纯 JS）
  # 交互，但依赖树里仍会解析到它，装齐二进制可避免任何 import 失败。
  koffi: true
  # node-pty —— DSH 终端相关能力使用的伪终端原生模块。
  node-pty: true
  # 以下三个的安装脚本只做预编译物落位或版本自检，不含源码编译。
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  protobufjs: true
  # electron-builder 26 引入；其 install 脚本只做「选 7z 架构」。
  # 本发行版只打 NSIS（不用 squirrel），无需其 7z，故显式拒绝而非放行，
  # 避免多下一份二进制。
  electron-winstaller: false

# 传递依赖覆盖（安全修复，对应 Dependabot 告警）
#
# ⚠️ 为什么这里和 package.json 的 pnpm.overrides 都要写：
#   · CI（release.yml）固定 pnpm 10 —— 只读 package.json 的 pnpm.overrides
#   · 本地 pnpm 11+ —— 不再读 package.json 的该字段，改读本文件的 overrides
#   两处必须保持同步，否则本地装出来的依赖树和 CI 不一致。
#
# tar: 6.x 已无补丁版（停在 6.2.1），受影响的是 5 个 ^6 消费方
#      （node-gyp / cacache / app-builder-lib / archiver / @electron/rebuild）。
#      7.5.22 仍导出 CommonJS 入口，可安全替换 ^6。
# builder-util-runtime: CVE-2026-54673，< 9.7.0 受影响。
overrides:
  # ── 与 package.json 的 pnpm.overrides 保持完全一致（见上方说明） ──
  '@deepseek-ai/dsh-attachment': 0.1.2-rc.1
  '@deepseek-ai/dsh-session': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-persistence': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-query': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-telemetry': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-title-llm': 0.1.2-rc.1
  '@deepseek-ai/dsh-llm': 0.1.2-rc.1
  '@deepseek-ai/dsh-fs': 0.1.2-rc.1
  '@deepseek-ai/dsh-jobs': 0.1.2-rc.1
  '@deepseek-ai/dsh-sandbox': 0.1.2-rc.1
  '@deepseek-ai/dsh-shell': 0.1.2-rc.1
  '@deepseek-ai/dsh-settings': 0.1.2-rc.1
  '@deepseek-ai/dsh-output-retention': 0.1.2-rc.1
  '@deepseek-ai/dsh-spill': 0.1.2-rc.1
  '@deepseek-ai/dsh-workflow': 0.1.2-rc.1
  '@deepseek-ai/dsh-anonymous-user-id': 0.1.2-rc.1
  '@deepseek-ai/dsh-code-runtime': 0.1.2-rc.1
  '@deepseek-ai/dsh-subagent-in-process-driver': 0.1.2-rc.1
  '@deepseek-ai/dsh-authorization': 0.1.2-rc.1
  '@deepseek-ai/dsh-bash-local': 0.1.2-rc.1
  '@deepseek-ai/dsh-compaction': 0.1.2-rc.1

  # ── 安全修复（Dependabot 告警） ──
  tar: ^7.5.22
  builder-util-runtime: ^9.7.0
