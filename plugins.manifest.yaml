  # 一顶三的账号接入插件（作者 iJetLi，MIT，未发 npm，只提供 Gitee 仓库源）：
  #   · codearts —— 华为云 CodeArts（IAM OAuth：portal /authorize → 本地回调 → STS
  #     换取含 refresh_token 的 AK/SK/SecurityToken，到期前静默续期），SDK-HMAC-SHA256
  #     签名调 snap-access 端点（GLM/盘古/DeepSeek V4 等模型，含免费额度模型适配）；
  #   · buddy    —— 腾讯 CodeBuddy 中国版（external-link-v2 轮询式登录、账号池、
  #     每日签到领积分、积分余额）；
  #   · workbuddy —— 腾讯 WorkBuddy 国际版（与 buddy 同源同协议，仅 endpoint/身份不同）。
  # 取代了原先的 dsh-connect-workbuddy（dingminhua，钉 v2.0.1，已移除）——
  # workbuddy provider 由本插件的 workbuddy 面板接管，凭据 ref（WORKBUDDY_ACCESS_TOKEN）
  # 同名兼容，且启动时会自动清理 domain 不符的旧账号。
  #
  # 来源：https://gitee.com/iJetLi/deepseek-harness-codearts（Gitee，非 GitHub、
  # 不在 JackAIStudio 组织下）。本发行版集成的基线是 master @ be6ba1c0435b218585a31d0ffd48489a9a6fed7a
  # （2026-09-17，比当时所有 tag 都新；上游无 npm 发行包，tag 也未随版本规律更新）。
  # 日常跟随 master；正式发版前建议按「ref 钉 tag/SHA」的惯例钉死。
  #
  # 兼容性（逐项核实过）：
  #   · peerDependencies 明写 @deepseek-ai/dsh-{credentials,commands,llm} ^0.1.2-rc.1
  #     —— 与本发行版内核 0.1.2-rc.1 精确匹配（比 workbuddy/trae 那种范围错位干净）；
  #   · 运行时依赖 jose ^6.1.3 —— 宿主 node_modules 已有 6.2.10；@deepseek-ai/schemastery
  #     宿主自带。均走 hoisted 布局解析，插件自己的 node_modules 不打进包。
  #
  # 构建：lib/ 被 .gitignore，且 exports["./client"] 指向 esbuild 产物
  # lib/client/jet-hub.js——只跑 tsc 的 build 会漏掉它（Jet Hub 面板加载失败），
  # 完整构建是 prepare（= build:all = tsc + esbuild）。prepare-bundle.js 的
  # ensureRepoBuilt 已改为「对齐 exports 产物目标，缺了依次补跑 build→prepack→prepare」。
  # 本地开发态：../plugins/dsh-codearts-auth 已就地 build:all，--source auto 优先用它。
  - name: dsh-codearts-auth
    repo: https://gitee.com/iJetLi/deepseek-harness-codearts.git
    ref: master
  # 社区开源精选插件（npm 公开发行包，开箱即用预装）
  - name: "@mlgbnb/dsh-archive-manager"
    npm: "@mlgbnb/dsh-archive-manager@1.0.7"
  - name: dsh-codex-timeline
    npm: "dsh-codex-timeline@0.6.0"
  - name: "@wxg-prc-cpg/browser-skill-dsh-plugin"
    npm: "@wxg-prc-cpg/browser-skill-dsh-plugin@0.2.1"
  # Trae 账号接入（作者 dingminhua，MIT）—— 与 dsh-connect-workbuddy 同族，
  # 把本机已登录的 Trae 账号接成 DSH 的 provider（含只读用量卡片）。
  #
  # 为什么钉 1.3.0 而不是 latest（2.0.4）—— 实测逐版比对 peerDependencies：
  #   版本       @deepseek-ai/dsh-llm 范围      @earendil-works/pi-ai   本发行版可用?
  #   1.0.0~1.1.1  ^0.1.1-rc.2                 0.82.1（精确钉死）      ✗ pi-ai 不符
  #   1.1.2~1.3.0  >=0.1.2-0 <0.2.0-0          >=0.82.1               ✅
  #   1.4.0~1.4.2  >=0.1.5-0 <0.2.0-0          >=0.85.1               ✗ 内核不符
  #   2.0.0~2.0.4  >=0.1.5-0 <0.2.0-0          >=0.85.1               ✗ 内核不符
  # 本发行版 = DSH 0.1.2-rc.1 + pi-ai 0.84.4（见 pnpm-lock.yaml）⇒ 只有 1.1.2~1.3.0 可用。
  # 取区间内最高的 1.3.0：1.2.0 的 CHANGELOG 明写「适配 DSH v0.1.2-rc.1 上游重构
  # （dsh-plugin-desktop 2.0.5），同一份构建继续兼容 0.1.1 宿主」，1.3.0 仅在其上追加
  # 「模型名内嵌积分倍率」，无内核范围变化。
  # 若将来本发行版内核升到 >=0.1.5 且 pi-ai 升到 >=0.85.1，可改钉 2.x。
  - name: dsh-connect-trae
    npm: "dsh-connect-trae@1.3.0"

  # ── 社区插件（作者独立仓库，MIT）────────────────────────────────────────────
  # 依赖自检（2026-09-18）：
  #   · dsh-damage-pulse：运行时依赖 zod（宿主面）——本发行版 node_modules 已有
  #     zod@4.5.4 ✅（满足其 peer ^4.4.3）；declared dependency qrcode 已被作者
  #     打进 lib/client.js（客户端 261KB 已自包含，运行期不 require），无需补装。
  #     其余 peer 全是 @deepseek-ai/* 内核包与 react，均已就位。
  #   · dsh-undo-savepoint：零 dependencies / peerDependencies，只用 node 内置模块 ✅。

  # Token 余额监控：鲸鱼娘待机/扣费/复苏动画、峰谷计费、连续扣费飘字、会话费用统计。
  - name: dsh-damage-pulse
    repo: https://github.com/wssfk12138/dsh-damage-pulse.git
    ref: master

  # 崩溃救援：配置与插件代码变更的可回滚快照、密钥安全、一键 SAFE MODE、
  # 以及 DSH 起不来时也能用的离线 CLI/GUI。
  - name: dsh-undo-savepoint
    repo: https://github.com/lire1131/dsh-undo-savepoint.git
    ref: master

  # Qoder CN adapter（作者 mo-n，MIT）—— 把 Qoder 订阅账号接成 DSH 的 LLM provider：
  #   · COSY 签名 + WAF 编码流式传输，直连 gateway.qoder.com.cn；
  #   · PAT（pt-...）通过 Models 页面安全存储、按进程换取短期 job token；
  #   · 支持公开云（仅需 PAT）和企业 VPC（settings.yaml 里设 llm-qoder.vpcInstance）；
  #   · 模型目录实时从 /algo/api/v2/model/list 拉取，新增 wire key（如 gmodel → glm-5.2）
  #     无需插件更新；内置重试由 dsh-llm-retry 统一接管。
  #
  # 依赖自检（2026-09-18）：
  #   · peerDependencies：@deepseek-ai/cordis ^4.0.2（宿主 4.0.2 ✅）、
  #     @deepseek-ai/dsh-{api-remotes,attachment,client-connection,client-locale,
  #     client-ui-settings,client-ui-slots,credentials,invariants,llm,settings,web}
  #     >=0.1.2-rc.1 <0.2（本发行版 0.1.5-rc.2 全部落在此区间 ✅）；
  #   · dependencies：@deepseek-ai/schemastery 3.18.1（宿主自带 ✅）；
  #   · 需搭配 @deepseek-ai/dsh-llm-retry 启用重试策略（已在内核清单里 ✅）。
  #
  # 安装后需：Settings → Models → Add provider → qoder-cn，粘贴 PAT。
  - name: dsh-provider-qoder
    repo: https://github.com/mo-n/dsh-provider-qoder.git
    ref: main
  #
  # ── 换肤三件套（随包分发、默认不启用，见 own-plugins.js 的 OPT_IN_PLUGINS）─────
  # 三个都钉 npm 发行包而不是仓库：上游仓库只有源码（皮肤资产/主题包在发布时才
  # 打进 lib/），npm 包是作者自己构建好的产物，CI 不必猜它的构建链。
  # 依赖自检（2026-09-19，逐个从 npm 的 lib/client.js 实读 require 列表）：
  #   内核浏览器 seed 表（dsh-web-frontend 前端产物里的 staticModules）在 0.1.5-rc.2
  #   上就是：react / react/jsx-runtime / react-dom / react-dom/client /
  #   @deepseek-ai/cordis / dsh-client-store / dsh-client-ui-slots /
  #   dsh-client-ui-primitives / dsh-client-ui-dockkit
  #   · dsh-dream-skin 9.16.0  —— 自带双代 shim（requireSeed try/catch，先 store 后旧名），
  #     零 dependencies，peer 全部落在宿主区间 ✅
  #   · dsh-client-ui-seaglass 1.6.7 —— client 侧只 require react/jsx-runtime +
  #     dsh-client-store + dsh-client-ui-primitives ✅；host 侧依赖
  #     @deepseek-ai/schemastery 3.18.2（宿主 hoisted node_modules 已有 ✅）
  #   · dsh-skin-manager 0.1.6  —— client 侧硬 require 已被平台移除的
  #     @deepseek-ai/dsh-client-runtime/client ⇒ 必抛 missed the module table，
  #     而任一 loader entry 导入失败会中止整个 web 壳启动（整屏 Failed to load
  #     plugins）。由 src/main/plugin-compat.js 的补丁把它改指后继 seed 模块
  #     dsh-client-store；实测该接收变量在插件里从未被使用，属上游残留死引用。
  #
  - name: dsh-dream-skin
    npm: "dsh-dream-skin@9.16.0"
  - name: dsh-client-ui-seaglass
    npm: "dsh-client-ui-seaglass@1.6.7"
  - name: dsh-skin-manager
    npm: "dsh-skin-manager@0.1.6"
