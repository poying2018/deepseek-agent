# DeepSeek Agent 内置自研插件清单（机器可读）
#
# 消费方：scripts/prepare-bundle.js 与 GitHub Actions（.github/workflows/release.yml）。
# repo 一律填 PUBLIC 开源地址——发行构建「所见即所开源」，可复现、可对账。
# ref  日常指向 main；正式发版时改成 tag（如 v1.2.0）以钉死构建输入。
#
# 本地开发态：若 ../plugins/<name> 存在，默认优先用本地源码（改了不用推就能测）；
# 用 `node scripts/prepare-bundle.js --source public` 可强制走本清单（与 CI 同路径）。
plugins:
  - name: dsh-mobile-plus
    repo: https://github.com/JackAIStudio/dsh-mobile-plus.git
    ref: main
  - name: dsh-grok-oauth
    repo: https://github.com/JackAIStudio/dsh-grok-oauth.git
    ref: main
  - name: dsh-gemini-oauth
    repo: https://github.com/JackAIStudio/dsh-gemini-oauth.git
    ref: main
  - name: dsh-deepseek-balance
    repo: https://github.com/JackAIStudio/dsh-deepseek-balance.git
    ref: main
  - name: dsh-today
    repo: https://github.com/JackAIStudio/dsh-today.git
    ref: main
  - name: dsh-web-restart
    repo: https://github.com/JackAIStudio/dsh-web-restart.git
    ref: main
  - name: dsh-workspace-path
    repo: https://github.com/JackAIStudio/dsh-workspace-path.git
    # 钉死在「Hero 工作区选择器顶掉官方选择器」那次重构之前。
    #
    # 该仓库 0cdfefa（"重构 Hero 工作区选择器，直接调用原生目录选择器"）用
    # priority: -10 抢占了 conversation.hero.workspace 槽位（single 槽位「最低
    # priority 渲染」），但它的「添加工作区」改成了直接调 uiWorkspace.pickDirectory()：
    #   · pickDirectory() 只对 native 后端成立，浏览后端的 capability 里根本没有 pick；
    #   · 它又无法渲染 conversation.hero.workspace.directoryFlow 空位
    #     （空位声明权在 ui-workspace 手里，第二个声明会抛 "already declared"），
    #     所以应用内目录浏览器永远出不来。
    # 结果：官方选择器被顶掉、自己的添加入口又必然失败 → 无法选择工作区。
    # 回到 6303361 后，该插件对 Hero 槽位的注册会因槽位冲突被静默放弃，
    # 官方选择器（配合 profile 里固定的 browse 交互）正常工作。
    # 上游修好后（见 patches/dsh-workspace-path-hero-picker.patch）即可改回 main。
    ref: 630336131600968b2cfe236b2192fe9a4098093e
  - name: dsh-robust-search
    repo: https://github.com/JackAIStudio/dsh-robust-search.git
    ref: main
  - name: dsh-reminder
    repo: https://github.com/JackAIStudio/dsh-reminder.git
    ref: main
  - name: dsh-app-badge
    repo: https://github.com/JackAIStudio/dsh-app-badge.git
    ref: main
  - name: dsh-session-navigator
    repo: https://github.com/JackAIStudio/dsh-session-navigator.git
    ref: main
  - name: dsh-plugin-dashboard
    repo: https://github.com/JackAIStudio/dsh-plugin-dashboard.git
    ref: main
  - name: dsh-web-search-follow
    repo: https://github.com/JackAIStudio/dsh-web-search-follow.git
    ref: main
  - name: dsh-workbuddy-dual
    repo: https://github.com/JackAIStudio/dsh-workbuddy-dual.git
    ref: main
  - name: dsh-better-sidebar
    repo: https://github.com/JackAIStudio/DSH-better-sidebar.git
    ref: main
  - name: dsh-paste-path
    repo: https://github.com/JackAIStudio/dsh-paste-path.git
    ref: main
  - name: dsh-autostart
    repo: https://github.com/JackAIStudio/dsh-autostart.git
    ref: main
  - name: dsh-browser-attach
    repo: https://github.com/JackAIStudio/dsh-browser-attach.git
    ref: main
  - name: dsh-cmdj-toggle
    repo: https://github.com/JackAIStudio/dsh-cmdj-toggle.git
    ref: main
  # 社区开源精选插件（npm 公开发行包，开箱即用预装）
  - name: "@mlgbnb/dsh-archive-manager"
    npm: "@mlgbnb/dsh-archive-manager@1.0.7"
  - name: dsh-codex-timeline
    npm: "dsh-codex-timeline@0.6.0"
  - name: "@wxg-prc-cpg/browser-skill-dsh-plugin"
    npm: "@wxg-prc-cpg/browser-skill-dsh-plugin@0.2.1"
  # 把本机已登录的 WorkBuddy 账号接成 DSH 的 workbuddy / workbuddy-global provider，
  # 附带只读积分概览与模型管理（国内版 + 国际版双区域并行）。
  #
  # 关于版本：2.0.1 的 peerDependencies 把 DSH 各包写成
  #   ">=0.1.5-rc.1 <0.2.0 || >=0.1.2-rc.1 <0.2.0"
  # 即已声明兼容本发行版的 0.1.2-rc.1；但它把 @earendil-works/pi-ai 写成
  #   ">=0.85.0 <0.86.0"
  # 而本发行版（DSH 0.1.2-rc.1）经 pnpm-lock 钉死的是 pi-ai 0.84.4。二者不一致，
  # 已实测确认不影响使用，故仍取最新版：
  #   · 插件只用 createProvider（@earendil-works/pi-ai）与 openAICompletionsApi
  #     （@earendil-works/pi-ai/api/openai-completions.lazy）两个 API；
  #     前者签名在 0.84.4/0.85.1 逐字符一致，CreateProviderOptions 完全一致，
  #     后者在 0.84.4 也存在（exports 的 "./api/*" 通配两版本相同）；
  #     models.d.ts 与 openai-completions.d.ts 的差异纯为新增
  #     （streamDeferred 方法、vllmPriority 字段），无破坏性改动。
  #   · 用真实 pi-ai 0.84.4 按插件的精确入参形态跑过 createProvider 装配，通过。
  # 若上游此后引入 0.85 专有 API，回退方案是钉 1.2.0（其 peer 明写接受
  # >=0.82.1 <0.85.0），代价是丢掉国际版支持（1.4.0 才加入）与 2.0.1 的关键修复。
  # 治理：prepare-bundle.js 只做 npm pack + 解包，不校验 peer，故上表不影响构建。
  - name: dsh-connect-workbuddy
    npm: "dsh-connect-workbuddy@2.0.1"
